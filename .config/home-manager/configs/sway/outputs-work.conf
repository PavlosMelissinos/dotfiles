# Work laptop monitor layout (included when MONITOR_PROFILE=work, the default).
#
# Internal panel: California Institute of Technology 0x1628, 2560x1600,
# scale 1.6 at x=3128 (immediately right of the Dell U2518D, logical width 2048).
# Logical panel size is 1600x1000, so monitors to its right start at
# 3128 + 2560/1.6 = 4728.

output $panel_work {
    resolution 2560x1600 position 3128 441
    scale 1.6
}

output $monitor2 {
    # Dell U2518D (left)
    resolution 2560x1440 position 1080 200
    scale 1.25
}

output $monitor3 {
    # Dell U2311H (vertical, far left)
    resolution 1080x1920 position 0 0
    transform 270
}

output $monitor4k_up {
    # Panasonic TV (above)
    resolution 4096x2160 position 0 120
    scale 2
}

output $monitor_fullhd_right {
    # Dell P2423DE (right)
    resolution 1920x1080 position 4728 0
    scale 1
}

output $monitor_4k_right {
    # Lenovo L28u-30 (right)
    resolution 4096x2160 position 4728 0
    scale 1.5
}
