# Home laptop monitor layout (included when MONITOR_PROFILE=home).
#
# Internal panel: Chimei Innolux 0x14D2, 1920x1080, scale 1.2 at x=3128
# (immediately right of the Dell U2518D, whose logical width is 2048).
# Monitors to the right of the laptop panel start at 3128 + 1920/1.2 = 4728.

output $panel_home {
    resolution 1920x1080 position 3128 441
    scale 1.2
}

output $monitor2 {
    # Dell U2518D (left)
    resolution 2560x1440 position 1080 200
    scale 1.25
}

output $monitor3 {
    # Dell U2311H (vertical, far left)
    resolution 1080x1920 position 0 0
    transform 270
}

output $monitor4k_up {
    # Panasonic TV (above)
    resolution 4096x2160 position 0 120
    scale 2
}

output $monitor_fullhd_right {
    # Dell P2423DE (right)
    resolution 1920x1080 position 4729 0
    scale 1
}

output $monitor_4k_right {
    # Lenovo L28u-30 (right)
    resolution 4096x2160 position 4729 0
    scale 1.5
}
