# foot configuration, deployed to ~/.config/foot/foot.ini by home-manager.
# See foot.ini(5) for all options.

[main]
# foot's built-in default is monospace:size=8; alacritty's default is 11.
# That size gap is why foot looked much smaller. Match alacritty.
font=monospace:size=11

# no  -> font sized from the (integer) output scale; sway's fractional scale
#        does not grow the font (same behaviour as alacritty), so text stays a
#        constant logical size and matches alacritty at the same point size.
# yes -> font sized from the monitor's physical DPI; same physical size on
#        every monitor, ignoring the compositor scale.
dpi-aware=no
